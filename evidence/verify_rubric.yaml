rubrics:
  - id: 1
    type: f2p
    text: "每次 resourceVersion 冲突重试都从最新 Subscription 重新构造更新，而不复用上一轮对象。"
  - id: 2
    type: f2p
    text: "本次明确修改的 subscriber、reply 和 dead-letter sink 在同一重试轮次重新解析并一起提交。"
  - id: 3
    type: f2p
    text: "未在命令中指定的 Subscription 字段保留冲突后最新的服务端值，不被旧快照覆盖。"
  - id: 4
    type: f2p
    text: "任一目标解析失败时不提交另外两个已解析引用，并返回可定位到对应目标的错误。"
  - id: 5
    type: f2p
    text: "冲突耗尽或权限失败不会留下半份目标组合，下一次命令可从服务端当前状态继续。"
  - id: 6
    type: f2p
    text: "命令打印成功前会确认服务端保存的三个 Destination 与本次修改意图一致。"
  - id: 7
    type: p2p
    text: "没有冲突时，Subscription create/update 及 URI、可寻址资源两类 sink 解析保持兼容。"
  - id: 8
    type: p2p
    text: "只修改一个 sink 时，其余目标和现有成功、错误输出格式保持不变。"
